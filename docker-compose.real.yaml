version: '3.8'

services:
    # Ollama - Local LLM inference server (ppc64le via conda ufcg-ibm)
    ollama:
        container_name: ollama
        build:
            context: ./docker/ollama
            dockerfile: Dockerfile
        image: simulator-ollama:ppc64le
        restart: unless-stopped
        runtime: nvidia
        ipc: host
        ports:
            - "11434:11434"
        ulimits:
            memlock: -1
        environment:
            - OLLAMA_MODELS_CONFIG=/app/ollama_models.yaml
            - OLLAMA_DEBUG=1
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
            - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/powerpc64le-linux-gnu:/usr/lib64
        volumes:
            - ollama_data:/root/.ollama
            - type: bind
              source: ./simulator/data/config.yaml
              target: /app/ollama_models.yaml
            - /usr/local/cuda-12.2:/usr/local/cuda:ro
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/ollama-ready"]
            interval: 10s
            timeout: 5s
            retries: 120
            start_period: 30s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    # Broker (same as before)
    broker:
        container_name: broker
        build:
            context: ./broker
            dockerfile: Dockerfile.api
        volumes:
            - type: bind
              source: ~/.kube/karmada.config
              target: /root/.kube/karmada.config
            - type: bind
              source: ~/.kube/members.config
              target: /root/.kube/members.config
        network_mode: "host"
        environment:
            - MODE=real
            - KWOK_MODE=false # Real mode: no KWOK tolerations

    # Monitor (same as before, adapts to both modes)
    monitor:
        container_name: monitor
        build:
            context: ./monitor
            dockerfile: Dockerfile
        network_mode: host

    # AI-Engine (now uses Ollama for local inference)
    ai-engine:
        container_name: ai-engine
        build:
            context: ./ai-engine
            dockerfile: Dockerfile.api
        environment:
            - OLLAMA_HOST=http://127.0.0.1:11434
        network_mode: "host"
        depends_on:
            ollama:
                condition: service_healthy

    # Actuator (same as before)
    actuator:
        container_name: actuator
        build:
            context: ./actuator
            dockerfile: Dockerfile.api
        volumes:
            - type: bind
              source: ~/.kube/karmada.config
              target: /root/.kube/config
        network_mode: "host"

    # MongoDB (same as before)
    mongo:
        container_name: mongo
        image: mongo:latest
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

networks:
    default:
        name: cloud-ai
        driver: bridge

volumes:
    mongo_data:
    ollama_data:

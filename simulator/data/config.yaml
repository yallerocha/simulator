# clusters initialzation
clusters:
  member1:
    nodes: 2
    cpu: "3"
    memory: "2560Mi"
    autoscaler: false

  member2:
    nodes: 2
    cpu: "3"
    memory: "2560Mi"
    autoscaler: false

# environment config
prometheus:
  grafana_enable: false

# engine config
ai-engine:
  enabled: true
  data:
    input_json: monitor_outputs.json
  ai:
    # mode: single_agent (1 chamada LLM direta)
    #       multi_agent (tools deterministicas em paralelo + 1 chamada LLM)
    #       multi_agent_votes (agentes LLM cpu/mem/pending votam + decision + explainer)
    mode: multi_agent
    selected_model: qwen3:8b
    scheduler_interval: 300
    timestamp_lookback_seconds: 600
    workloads_shard_size: 200
    fetch_metrics_immediately: false
    single_agent:
      selected_prompt: single_agent_v1
      provider: ollama
      generation_config:
        temperature: 0.1
        max_output_tokens: 18000
    multi_agent:
      selected_prompt: multi_agent
      provider: ollama
      generation_config:
        temperature: 0.1
        max_output_tokens: 18000
    multi_agent_votes:
      selected_prompt: multi_agent
      provider: ollama
      generation_config:
        temperature: 0.1
        max_output_tokens: 18000
      # weighted_sum: soma ponderada deterministica dos votos (maioria por peso)
      # llm_judge: um agente LLM decide, recebendo votos e pesos no prompt
      aggregation: weighted_sum
      agents:
        cpu_checker:
          enabled: true
          weight: 1.0
        memory_checker:
          enabled: true
          weight: 1.0
        pending_checker:
          enabled: true
          weight: 1.5
    default_config:
      provider: ollama
      generation_config:
        temperature: 0.1
        max_output_tokens: 18000
    models:
      qwen3:8b:
        model_name: qwen3:8b
        provider: ollama
        ollama_config:
          num_ctx: 32768
          num_thread: 20
          # num_gpu: nº de camadas na GPU. 0 = CPU puro; 999 = tudo na GPU;
          # remova a linha para deixar o Ollama decidir automaticamente.
          num_gpu: 999
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      tinyllama:
        model_name: tinyllama
        provider: ollama
        ollama_config:
          num_ctx: 2048
          num_thread: 20
        generation_config:
          temperature: 0.1
          max_output_tokens: 2048
      llama3.1:8b:
        model_name: llama3.1:8b
        provider: ollama
        ollama_config:
          num_ctx: 8192
          num_thread: 20
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      gemma3:4b:
        model_name: gemma3:4b
        provider: ollama
        ollama_config:
          num_ctx: 8192
          num_thread: 20
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      gemma4:31b:
        model_name: gemma4:31b
        provider: ollama
        ollama_config:
          num_ctx: 32768
          num_thread: 20
          # num_gpu: nº de camadas na GPU. 0 = CPU puro; 999 = tudo na GPU;
          # remova a linha para deixar o Ollama decidir automaticamente.
          num_gpu: 999
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      # Modelos remotos (OpenRouter) mantidos para referência
      gemini:
        model_name: google/gemini-2.0-flash-001
        provider: openrouter
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      claude:
        model_name: anthropic/claude-3.5-sonnet
        provider: openrouter
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
      gpt-4o:
        model_name: openai/gpt-4o
        provider: openrouter
        generation_config:
          temperature: 0.1
          max_output_tokens: 6000
    cluster_selection:
      listed_clusters: []
  paths:
    output_dir: ai-engine/data/output
    log_dir: ai-engine/logs
  logging:
    level: DEBUG
    file: ai_engine.log
  monitor:
    host: 0.0.0.0
    port: 8082
    route: metrics
  actuator:
    host: 0.0.0.0
    port: 8084
    route: apply
  server:
    host: 0.0.0.0
    port: 8083
    reload: false

# monitor config
monitor:
  collection_interval: 30

# actuator config
actuator:
  orchestrator: karmada # karmada or morpheus
  server:
    port: 8084
  file:
    recommendations: recommendations_example.csv
  mode: auto # Options: "auto" or "human-in-the-loop"
  morpheus:
    url: "https://CHANGE_ME_WITH_YOUR_MORPHEUS_URL"
    access_token: "CHANGE_ME_WITH_YOUR_MORPHEUS_ACCESS_TOKEN"
    refresh_token: "CHANGE_ME_WITH_YOUR_MORPHEUS_REFRESH_TOKEN"
    expires_in: 604800 # 7 days
    scope: "write"
    clusters: []
services:
    ollama:
        container_name: ollama
        # ppc64le: Ollama instalado via conda do canal ufcg-ibm
        # (conda install ufcg-ibm::ollama-ppc64le)
        build:
            context: ./docker/ollama
            dockerfile: Dockerfile
        image: simulator-ollama:ppc64le
        restart: unless-stopped
        runtime: nvidia
        ipc: host
        ports:
            - "11434:11434"
        ulimits:
            memlock: -1
        environment:
            - OLLAMA_MODELS_CONFIG=/app/ollama_models.yaml
            - OLLAMA_DEBUG=1
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
            - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/lib/powerpc64le-linux-gnu:/usr/lib64
        volumes:
            - ollama_data:/root/.ollama
            - type: bind
              source: ./simulator/data/config.yaml
              target: /app/ollama_models.yaml
            - /usr/local/cuda-12.2:/usr/local/cuda:ro
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/ollama-ready"]
            interval: 10s
            timeout: 5s
            retries: 120
            start_period: 30s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    broker:
        container_name: broker
        build:
            context: ./broker
            dockerfile: Dockerfile.api
        restart: unless-stopped
        volumes:
            - type: bind
              source: ~/.kube/karmada.config
              target: /root/.kube/karmada.config
            - type: bind
              source: ~/.kube/members.config
              target: /root/.kube/members.config
        network_mode: "host"
        depends_on:
            - mongo
        environment:
            - KWOK_MODE=false

    monitor:
        container_name: monitor
        build:
            context: ./monitor
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            - SIMULATOR_CONFIG=/app/simulator_config.yaml
            - KWOK_MODE=false
        volumes:
            - type: bind
              source: ./simulator/data/config.yaml
              target: /app/simulator_config.yaml
        network_mode: host
    ai-engine:
        container_name: ai-engine
        build:
            context: ./ai-engine
            dockerfile: Dockerfile.api
        restart: unless-stopped
        environment:
            - SIMULATOR_CONFIG=/app/simulator_config.yaml
            - OLLAMA_HOST=http://127.0.0.1:11434
            # Chaves de API remotas mantidas como fallback (opcionais)
            - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
            - GROQ_API_KEY=${GROQ_API_KEY:-}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
        volumes:
            - type: bind
              source: ./simulator/data/config.yaml
              target: /app/simulator_config.yaml
        network_mode: "host"
        depends_on:
            monitor:
                condition: service_started
            actuator:
                condition: service_started
            ollama:
                condition: service_healthy
    actuator:
        container_name: actuator
        build:
            context: ./recommendations-manager
            dockerfile: Dockerfile.api
        restart: unless-stopped
        environment:
            - SIMULATOR_CONFIG=/simulator/data/config.yaml
        volumes:
            - type: bind
              source: ~/.kube/karmada.config
              target: /root/.kube/config
            - type: bind
              source: ~/.kwok
              target: /root/.kwok
            - type: bind
              source: ./simulator/data/config.yaml
              target: /simulator/data/config.yaml
        network_mode: "host"
        depends_on:
            - mongo
    mongo:
        container_name: mongo
        # Imagem oficial `mongo` não tem build ppc64le; construímos do conda-forge
        # (MongoDB 6.0). Portável: funciona em amd64 e ppc64le. Ver ./mongo/Dockerfile.
        build:
            context: ./mongo
            dockerfile: Dockerfile
        image: simulator-mongo:6.0
        restart: unless-stopped
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

networks:
    default:
        name: cloud-ai
        driver: bridge

volumes:
    mongo_data:
    config_data:
    ollama_data:
